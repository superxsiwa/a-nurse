<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="nurseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>

    <linearGradient id="seniorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.05">
    <path d="M0,80 H1200 M0,160 H1200 M0,240 H1200 M0,320 H1200 M0,400 H1200 M0,480 H1200 M0,560 H1200 M0,640 H1200" stroke="#ffffff" stroke-width="1"/>
    <path d="M150,0 V680 M300,0 V680 M450,0 V680 M600,0 V680 M750,0 V680 M900,0 V680 M1050,0 V680" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Header Banner -->
  <g transform="translate(60, 40)">
    <rect width="180" height="28" rx="14" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
    <text x="90" y="18" fill="#38bdf8" font-family="'Sarabun', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
      ✨ A-NURSE SIMPLE WORKFLOW
    </text>
    
    <text x="0" y="65" fill="#ffffff" font-family="'Prompt', sans-serif" font-size="26" font-weight="bold">
      ภาพแสดงขั้นตอนการทำงานของระบบ A-Nurse (เข้าใจง่ายใน 4 ขั้นตอน)
    </text>
    <text x="0" y="90" fill="#94a3b8" font-family="'Sarabun', sans-serif" font-size="14">
      วงจรการค้นหาแนวปฏิบัติข้างเตียง • ตรวจจับคำถามซ้ำ • ส่งต่อพี่ In-charge • สู่คลังปัญญาส่วนกลาง
    </text>
  </g>

  <!-- ========================================== -->
  <!-- 4 MAIN STEPS HORIZONTAL FLOW CARDS        -->
  <!-- ========================================== -->

  <!-- STEP 1: น้องถาม AI ข้างเตียง -->
  <g transform="translate(60, 160)" filter="url(#shadow)">
    <rect width="250" height="420" rx="20" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4"/>
    <rect width="250" height="70" rx="20" fill="url(#nurseGrad)"/>
    <rect width="250" height="20" y="50" fill="url(#nurseGrad)"/>
    
    <!-- Step Badge -->
    <circle cx="36" cy="35" r="18" fill="#ffffff"/>
    <text x="36" y="41" fill="#0284c7" font-family="'Prompt', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">1</text>
    
    <text x="65" y="32" fill="#ffffff" font-family="'Prompt', sans-serif" font-size="16" font-weight="bold">น้องพยาบาล</text>
    <text x="65" y="48" fill="#bae6fd" font-family="'Sarabun', sans-serif" font-size="11">สงสัยแนวปฏิบัติข้างเตียง</text>

    <!-- Card Body -->
    <g transform="translate(20, 95)">
      <circle cx="105" cy="45" r="35" fill="#0284c7" fill-opacity="0.15"/>
      <text x="105" y="55" font-size="34" text-anchor="middle">📱</text>

      <text x="105" y="110" fill="#f8fafc" font-family="'Prompt', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">
        พิมพ์ถาม AI Assistant
      </text>

      <rect x="0" y="130" width="210" height="75" rx="10" fill="#0b1120" stroke="#334155" stroke-width="1"/>
      <text x="10" y="152" fill="#38bdf8" font-family="'Sarabun', sans-serif" font-size="11" font-weight="bold">ตัวอย่างคำถาม:</text>
      <text x="10" y="172" fill="#cbd5e1" font-family="'Sarabun', sans-serif" font-size="11">"คนไข้ Post-TAVI 24 ชม.</text>
      <text x="10" y="190" fill="#cbd5e1" font-family="'Sarabun', sans-serif" font-size="11">ต้องเฝ้าระวังอะไรบ้าง?"</text>

      <!-- Outcome -->
      <g transform="translate(0, 220)">
        <rect width="210" height="42" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
        <text x="10" y="25" fill="#34d399" font-family="'Sarabun', sans-serif" font-size="11" font-weight="bold">✅ AI ตอบตรง CPG</text>
        <text x="120" y="25" fill="#94a3b8" font-family="'Sarabun', sans-serif" font-size="10">ดูแลคนไข้ทันที</text>
      </g>

      <g transform="translate(0, 270)">
        <rect width="210" height="42" rx="8" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
        <text x="10" y="25" fill="#fbbf24" font-family="'Sarabun', sans-serif" font-size="11" font-weight="bold">❓ คำถามซับซ้อน</text>
        <text x="110" y="25" fill="#f59e0b" font-family="'Sarabun', sans-serif" font-size="10">กด [ส่งถามพี่]</text>
      </g>
    </g>
  </g>

  <!-- ARROW 1 -> 2 -->
  <g transform="translate(315, 340)">
    <path d="M0,0 L25,0" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4,4"/>
    <polygon points="25,-6 35,0 25,6" fill="#38bdf8"/>
  </g>

  <!-- STEP 2: ระบบตรวจจับคำถามซ้ำ -->
  <g transform="translate(355, 160)" filter="url(#shadow)">
    <rect width="250" height="420" rx="20" fill="url(#cardGrad1)" stroke="#8b5cf6" stroke-width="2" stroke-opacity="0.4"/>
    <rect width="250" height="70" rx="20" fill="url(#aiGrad)"/>
    <rect width="250" height="20" y="50" fill="url(#aiGrad)"/>
    
    <!-- Step Badge -->
    <circle cx="36" cy="35" r="18" fill="#ffffff"/>
    <text x="36" y="41" fill="#7c3aed" font-family="'Prompt', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">2</text>
    
    <text x="65" y="32" fill="#ffffff" font-family="'Prompt', sans-serif" font-size="16" font-weight="bold">ระบบ AI & สกัดซ้ำ</text>
    <text x="65" y="48" fill="#e9d5ff" font-family="'Sarabun', sans-serif" font-size="11">Similarity Check (>=65%)</text>

    <!-- Card Body -->
    <g transform="translate(20, 95)">
      <circle cx="105" cy="45" r="35" fill="#8b5cf6" fill-opacity="0.15"/>
      <text x="105" y="55" font-size="34" text-anchor="middle">🧠</text>

      <text x="105" y="110" fill="#f8fafc" font-family="'Prompt', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">
        สแกนตรวจคำถามซ้ำ
      </text>

      <!-- Case 1: พี่เคยตอบแล้ว -->
      <g transform="translate(0, 130)">
        <rect width="210" height="85" rx="10" fill="#0b1120" stroke="#10b981" stroke-width="1.5"/>
        <text x="10" y="22" fill="#34d399" font-family="'Sarabun', sans-serif" font-size="11" font-weight="bold">💡 ข้อ ก. พี่เคยตอบไว้แล้ว</text>
        <text x="10" y="42" fill="#e2e8f0" font-family="'Sarabun', sans-serif" font-size="10">• ส่งคำตอบที่รับรองแล้วทันที</text>
        <text x="10" y="60" fill="#e2e8f0" font-family="'Sarabun', sans-serif" font-size="10">• ปิดข้อสงสัย ไม่ต้องรอพี่</text>
        <text x="10" y="76" fill="#38bdf8" font-family="'Sarabun', sans-serif" font-size="9">(Zero Wait Time)</text>
      </g>

      <!-- Case 2: รอพี่ตอบ -->
      <g transform="translate(0, 225)">
        <rect width="210" height="85" rx="10" fill="#0b1120" stroke="#f59e0b" stroke-width="1.5"/>
        <text x="10" y="22" fill="#fbbf24" font-family="'Sarabun', sans-serif" font-size="11" font-weight="bold">⏳ ข้อ ข. มีเพื่อนเพิ่งถาม</text>
        <text x="10" y="42" fill="#e2e8f0" font-family="'Sarabun', sans-serif" font-size="10">• ชวนกด [🔔 +1 ติดตาม]</text>
        <text x="10" y="60" fill="#e2e8f0" font-family="'Sarabun', sans-serif" font-size="10">• ดันคำถามขึ้นเป็น Priority สูง</text>
        <text x="10" y="76" fill="#fbbf24" font-family="'Sarabun', sans-serif" font-size="9">• ลดคำถามซ้ำในคิว 80%</text>
      </g>
    </g>
  </g>

  <!-- ARROW 2 -> 3 -->
  <g transform="translate(610, 340)">
    <path d="M0,0 L25,0" stroke="#8b5cf6" stroke-width="3" stroke-dasharray="4,4"/>
    <polygon points="25,-6 35,0 25,6" fill="#8b5cf6"/>
  </g>

  <!-- STEP 3: พี่ In-charge ตอบ & รับรอง -->
  <g transform="translate(650, 160)" filter="url(#shadow)">
    <rect width="250" height="420" rx="20" fill="url(#cardGrad1)" stroke="#ec4899" stroke-width="2" stroke-opacity="0.4"/>
    <rect width="250" height="70" rx="20" fill="url(#seniorGrad)"/>
    <rect width="250" height="20" y="50" fill="url(#seniorGrad)"/>
    
    <!-- Step Badge -->
    <circle cx="36" cy="35" r="18" fill="#ffffff"/>
    <text x="36" y="41" fill="#db2777" font-family="'Prompt', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">3</text>
    
    <text x="65" y="32" fill="#ffffff" font-family="'Prompt', sans-serif" font-size="16" font-weight="bold">พี่ In-charge CCU</text>
    <text x="65" y="48" fill="#fbcfe8" font-family="'Sarabun', sans-serif" font-size="11">Mentorship Verification</text>

    <!-- Card Body -->
    <g transform="translate(20, 95)">
      <circle cx="105" cy="45" r="35" fill="#ec4899" fill-opacity="0.15"/>
      <text x="105" y="55" font-size="34" text-anchor="middle">👩‍⚕️</text>

      <text x="105" y="110" fill="#f8fafc" font-family="'Prompt', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">
        ตรวจ & เฉลยคำตอบ
      </text>

      <rect x="0" y="130" width="210" height="95" rx="10" fill="#0b1120" stroke="#334155" stroke-width="1"/>
      <text x="10" y="24" fill="#f472b6" font-family="'Sarabun', sans-serif" font-size="11" font-weight="bold">กระดานถามพี่:</text>
      <text x="10" y="44" fill="#cbd5e1" font-family="'Sarabun', sans-serif" font-size="10">• เห็นคำถามตามจำนวนคนรอ</text>
      <text x="10" y="62" fill="#cbd5e1" font-family="'Sarabun', sans-serif" font-size="10">• กดปุ่ม [✍️ ตอบคำถาม]</text>
      <text x="10" y="80" fill="#cbd5e1" font-family="'Sarabun', sans-serif" font-size="10">• ระบุ CPG ศิริราช อ้างอิง</text>

      <!-- Action Button Visual -->
      <g transform="translate(0, 240)">
        <rect width="210" height="45" rx="10" fill="#059669" stroke="#10b981" stroke-width="1"/>
        <text x="105" y="28" fill="#ffffff" font-family="'Prompt', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
          ✓ ตอบ &amp; รับรองเข้าคลังทันที
        </text>
      </g>
    </g>
  </g>

  <!-- ARROW 3 -> 4 -->
  <g transform="translate(905, 340)">
    <path d="M0,0 L25,0" stroke="#ec4899" stroke-width="3" stroke-dasharray="4,4"/>
    <polygon points="25,-6 35,0 25,6" fill="#ec4899"/>
  </g>

  <!-- STEP 4: คลังความรู้ Vector & ทุกคนได้คำตอบ -->
  <g transform="translate(945, 160)" filter="url(#shadow)">
    <rect width="200" height="420" rx="20" fill="url(#cardGrad1)" stroke="#10b981" stroke-width="2" stroke-opacity="0.4"/>
    <rect width="200" height="70" rx="20" fill="url(#greenGrad)"/>
    <rect width="200" height="20" y="50" fill="url(#greenGrad)"/>
    
    <!-- Step Badge -->
    <circle cx="36" cy="35" r="18" fill="#ffffff"/>
    <text x="36" y="41" fill="#059669" font-family="'Prompt', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">4</text>
    
    <text x="65" y="32" fill="#ffffff" font-family="'Prompt', sans-serif" font-size="16" font-weight="bold">คลังความรู้</text>
    <text x="65" y="48" fill="#a7f3d0" font-family="'Sarabun', sans-serif" font-size="11">Vector AI Core</text>

    <!-- Card Body -->
    <g transform="translate(15, 95)">
      <circle cx="85" cy="45" r="35" fill="#10b981" fill-opacity="0.15"/>
      <text x="85" y="55" font-size="34" text-anchor="middle">📚</text>

      <text x="85" y="110" fill="#f8fafc" font-family="'Prompt', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
        ความรู้ไม่สูญหาย
      </text>

      <rect x="0" y="130" width="170" height="150" rx="10" fill="#0b1120" stroke="#334155" stroke-width="1"/>
      <text x="10" y="25" fill="#34d399" font-family="'Sarabun', sans-serif" font-size="11" font-weight="bold">ผลลัพธ์ยั่งยืน:</text>
      <text x="10" y="48" fill="#cbd5e1" font-family="'Sarabun', sans-serif" font-size="10">1. น้องที่กดติดตาม</text>
      <text x="20" y="65" fill="#38bdf8" font-family="'Sarabun', sans-serif" font-size="10">ได้รับคำตอบพร้อมกัน</text>
      <text x="10" y="90" fill="#cbd5e1" font-family="'Sarabun', sans-serif" font-size="10">2. คำตอบแปลงเป็น</text>
      <text x="20" y="108" fill="#a7f3d0" font-family="'Sarabun', sans-serif" font-size="10">Vector AI ตลอดไป</text>
      <text x="10" y="132" fill="#cbd5e1" font-family="'Sarabun', sans-serif" font-size="10">3. เวรต่อไปถามได้ทันที</text>
    </g>
  </g>

  <!-- Bottom Return Loop -->
  <path d="M1045,595 C1045,635 185,635 185,595" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,6"/>
  <polygon points="180,595 185,585 190,595" fill="#38bdf8"/>
  <rect x="500" y="620" width="200" height="24" rx="12" fill="#0b1120" stroke="#38bdf8" stroke-width="1"/>
  <text x="600" y="636" fill="#38bdf8" font-family="'Sarabun', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">
    🔄 วงจรปัญญาสะสมต่อเนื่อง (Continuous Learning Loop)
  </text>
</svg>

